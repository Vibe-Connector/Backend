spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vibelink}
    username: ${DB_USERNAME:vibelink}
    password: ${DB_PASSWORD:vibelink1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:vibelink-default-secret-key-for-development-only-change-in-production-please}
  access-token-expiration: 1800000    # 30분
  refresh-token-expiration: 604800000 # 7일

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
  naver:
    client-id: ${NAVER_CLIENT_ID:your-naver-client-id}
    client-secret: ${NAVER_CLIENT_SECRET:your-naver-client-secret}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:vibelink-uploads}
      region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  max-tokens: 500
  temperature: 0.8
  embedding-model: text-embedding-3-small
  embedding-dimensions: 1536
  dalle:
    model: dall-e-3
    size: 1024x1024
    quality: standard

email:
  verification:
    expiration: 300000  # 5분

vibe:
  recommendation:
    items-per-category: 3

aiserver:
  base-url: ${AI_SERVER_URL:http://localhost:8000}
  api-prefix: /api/v1
  timeout:
    connect: 5
    read: 30
